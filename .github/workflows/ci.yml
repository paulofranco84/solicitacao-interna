name: CI Hack CAIXA
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore API_Solicitacoes
      - run: dotnet build API_Solicitacoes --no-restore -c Release
      - run: dotnet test API_Solicitacoes.Tests --no-build -c Release --verbosity normal